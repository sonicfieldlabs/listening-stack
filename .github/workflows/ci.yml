name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Reusable CI must not share the calling release workflow concurrency group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.16"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.7"
          python-version: "3.12.16"
      - run: uv lock --check --no-build

  unit:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -I scripts/check_tests.py unit --junitxml "$RUNNER_TEMP/installer-unit.xml"
      - run: python scripts/build_release.py
      - name: Verify reproducible archive
        run: |
          first="$(python -c 'from hashlib import sha256; from pathlib import Path; print(sha256(Path("dist/listening-stack.pyz").read_bytes()).hexdigest())')"
          python scripts/build_release.py
          second="$(python -c 'from hashlib import sha256; from pathlib import Path; print(sha256(Path("dist/listening-stack.pyz").read_bytes()).hexdigest())')"
          test "$first" = "$second"
      - run: ./dist/listening-stack.pyz models --json
      - run: bash -n install.sh listening-stack

  owners:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify reviewed owner fixtures
        run: shasum -a 256 -c vendor/SHA256SUMS
      - run: python -m pip install --find-links vendor '.[owner-test]'
      - run: python -I scripts/check_tests.py owners --junitxml "$RUNNER_TEMP/installer-owners.xml"
