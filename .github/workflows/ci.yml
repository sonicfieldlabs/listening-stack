name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - name: Verify reproducible archive
        run: |
          first="$(python -c 'from hashlib import sha256; from pathlib import Path; print(sha256(Path("dist/listening-stack.pyz").read_bytes()).hexdigest())')"
          python scripts/build_release.py
          second="$(python -c 'from hashlib import sha256; from pathlib import Path; print(sha256(Path("dist/listening-stack.pyz").read_bytes()).hexdigest())')"
          test "$first" = "$second"
      - run: ./dist/listening-stack.pyz models --json
      - run: bash -n install.sh listening-stack
