name: Release executable

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify release tag
        run: |
          project_version="$(python -c 'from pathlib import Path; import re; print(re.search(r"^version = \"([^\"]+)\"", Path("pyproject.toml").read_text(), re.MULTILINE).group(1))')"
          package_version="$(PYTHONPATH=src python -c 'import listening_stack; print(listening_stack.__version__)')"
          test "$GITHUB_REF_NAME" = "v$project_version"
          test "$project_version" = "$package_version"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/listening-stack.pyz
          dist/listening-stack.pyz.sha256
          --title "Listening Stack $GITHUB_REF_NAME"
          --generate-notes
