[project]
name = "sonicfield-listening-stack"
version = "0.3.1"
description = "Reproducible installer and runtime verifier for the accountable listening core and optional GERM."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sonic Field Labs" }]
keywords = ["audio", "installer", "listening", "local-first", "machine-listening"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://sonicfield.org/stack"
Repository = "https://github.com/sonicfieldlabs/listening-stack"
Issues = "https://github.com/sonicfieldlabs/listening-stack/issues"

[project.scripts]
listening-stack = "listening_stack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listening_stack"]
