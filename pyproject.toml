[project]
name = "sonicfield-listening-stack"
version = "0.5.0"
description = "Reproducible installer and runtime verifier for the accountable listening core and optional GERM."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sonic Field Labs" }]
keywords = ["audio", "installer", "listening", "local-first", "machine-listening"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
test = ["pytest>=8"]
owner-test = [
  "pytest>=8",
  "sonicfield-oida==0.12.0; python_version >= '3.12'",
  "akousma==0.8.4",
  "akousmata==0.8.3",
  "akouo-contract==0.10.1",
]

[tool.uv.sources]
sonicfield-oida = { path = "vendor/sonicfield_oida-0.12.0-py3-none-any.whl" }
akousma = { path = "vendor/akousma-0.8.4-py3-none-any.whl" }
akousmata = { path = "vendor/akousmata-0.8.3-py3-none-any.whl" }
akouo-contract = { path = "vendor/akouo_contract-0.10.1-py3-none-any.whl" }

[project.urls]
Homepage = "https://sonicfield.org/stack"
Repository = "https://github.com/sonicfieldlabs/listening-stack"
Issues = "https://github.com/sonicfieldlabs/listening-stack/issues"

[project.scripts]
listening-stack = "listening_stack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listening_stack"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/docs", "/vendor/*.whl",
  "/vendor/SHA256SUMS", "/vendor/owner-test-wheels.json", "/vendor/NOTICE.md",
  "/README.md", "/CHANGELOG.md", "/LICENSE", "/CITATION.cff",
  "/pyproject.toml", "/uv.lock", "/install.sh", "/listening-stack",
  "/.gitignore", "/.github/workflows",
]
